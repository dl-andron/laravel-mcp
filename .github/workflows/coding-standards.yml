name: fix code styling

# Фильтр по веткам — правка форка: с `on: [push]` workflow запускается и на
# пуш тегов, а закоммитить исправления стиля в тег он не может и падает.
on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  lint:
    uses: laravel/.github/.github/workflows/coding-standards.yml@9c15e86fffce728fb6c50ebeae24fd63e98f4d1d # main
